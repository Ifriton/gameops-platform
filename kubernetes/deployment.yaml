apiVersion: apps/v1
kind: Deployment
metadata:
  name: gameops-api
  namespace: gameops
  labels:
    app.kubernetes.io/name: gameops-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gameops-platform
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gameops-platform
    spec:
      serviceAccountName: gameops-api
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: gameops-platform:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: gameops-config
          env:
            - name: GAMEOPS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: gameops-api-key
                  key: api-key
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsUser: 10001
          volumeMounts:
            - name: sqlite-data
              mountPath: /tmp/gameops
      volumes:
        - name: sqlite-data
          emptyDir: {}
